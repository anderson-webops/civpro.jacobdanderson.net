name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: civpro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source-linked portable build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build-toolchain/package-lock.json

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(npm --version)" = "12.2.2"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Install Chromium for rendered checks
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run complete project checks
        run: npm run check
